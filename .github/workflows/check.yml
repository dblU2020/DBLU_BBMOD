# Runs the JOEBOX test suites on every push / PR.
# Needs a repository secret FW_URL (the 1010music download link for blackbox 3.1.9).
# The firmware is downloaded at run time and never committed.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi unzip
          pip install -q unicorn capstone numpy
      - name: Stock firmware
        env:
          FW_URL: ${{ secrets.FW_URL }}
        run: tools/fetch_firmware.sh
      - name: Build and test
        run: ./check.sh
